
name: data-lake-lab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lake_app
      POSTGRES_DB: lake_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lake_app -d lake_demo"]
      interval: 10s
      timeout: 3s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres_data:
